{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Профессия{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Шапка -->
    <header class="bg-primary text-white py-4">
        <div class="container">
            <h1 class="text-center">Анализ профессий и зарплат</h1>
        </div>
    </header>

    <!-- Левое меню -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Главная</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'stats' %}">Общая статистика</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'demand' %}">Востребованность</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'geo' %}">География</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'skills' %}">Навыки</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'recent_jobs' %}">Последние вакансии</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Контент -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="bg-dark text-white py-3 mt-4">
        <div class="container">
            <p class="text-center mb-0">© 2025 Павлова Дарья РИ-230910</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
