{% extends 'base.html' %}

{% block title %}Востребованность{% endblock %}

{% block content %}
<h1>Востребованность профессии</h1>
<h2>Динамика уровня зарплат</h2>

<canvas id="demandChart" width="400" height="200"></canvas>

<h3 class="mt-4">Таблица зарплат</h3>
<table class="table table-striped table-bordered mt-4">
    <thead>
        <tr>
            <th>Год</th>
            <th>Средняя зарплата</th>
        </tr>
    </thead>
    <tbody>
        {% for stat in statistics %}
        <tr>
            <td>{{ stat.year }}</td>
            <td>{{ stat.avg_salary }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
// График востребованности
const ctx = document.getElementById('demandChart').getContext('2d');
const demandChart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: [{% for stat in statistics %}'{{ stat.year }}',{% endfor %}],
        datasets: [{
            label: 'Средняя зарплата',
            data: [{% for stat in statistics %}{{ stat.avg_salary }},{% endfor %}],
            backgroundColor: 'rgba(255, 99, 132, 0.2)',
            borderColor: 'rgba(255, 99, 132, 1)',
            borderWidth: 1
        }]
    },
    options: {
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>
{% endblock %}
